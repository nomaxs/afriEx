name: update-rates

on:
  schedule:
    - cron: "0 2 * * *" # Runs daily at 02:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo with write permissions
    - uses: actions/checkout@v3
      with:
        persist-credentials: true
        fetch-depth: 0

    # 2. Setup Node.js
    - uses: actions/setup-node@v3
      with:
        node-version: 18

    # 3. Run archive generation
    - name: Generate archive
      run: node generator/generateArchives.js

    # 4. Run page generation

    # 5. Run sitemap generator
    - name: Generate sitemap
      run: node generator/sitemapGenerator.js

    # 6. Commit and push changes
    - name: Commit generated files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add archives pages seo/sitemap.xml
        git diff --cached --quiet || git commit -m "Update archives & generated pages"
        git push
