name: update-rates

on:
 schedule:
  - cron: "0 2 * * *"
 workflow_dispatch:

jobs:
 build:

  runs-on: ubuntu-latest

  steps:

  - uses: actions/checkout@v3

  - uses: actions/setup-node@v3
    with:
      node-version: 18

  - run: node generator/generateArchives.js

  - run: node generator/generatePages.js

  - run: node generator/sitemapGenerator.js

  - run: |
      git config --global user.name "bot"
      git config --global user.email "bot@github.com"
      git add .
      git commit -m "update rates"
      git push
